# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Wallet App CI for New Pull Requests

on:
  pull_request:
    paths-ignore:
      - "**.md"
    branches:
      - "*"

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      # https://github.com/actions/checkout
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      # only install dependencies
      # https://github.com/cypress-io/github-action
      - name: Install 📦
        uses: cypress-io/github-action@v6
        with:
          runTests: false

  cypress-tests:
    name: Run cypress unit tests
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Component tests 🧪
        uses: cypress-io/github-action@v6
        with:
          command: yarn run cypress-component-test

  e2e-tests:
    name: Run the e2e tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - name: Install dependencies
        run: yarn workspace user install
      - name: Start the app
        run: |
          # start web in background
           yarn workspace web dev &
           WEB_PID=$!

           # start user backend in background
           yarn workspace user dev &
           USER_PID=$!

           # wait until both are ready
           npx --yes wait-on http://localhost:3000 http://localhost:8080

           # run e2e tests
           yarn bdd:e2e || EXIT_CODE=$?

           # kill background servers
           kill $WEB_PID $USER_PID

           # exit with the same code as tests
           exit ${EXIT_CODE:-0}
